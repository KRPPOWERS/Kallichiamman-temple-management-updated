name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # silences Node 20 deprecation warning

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 (required by Android Gradle plugin) ────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Node.js (no cache — avoids lock-file-not-found error) ──
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # cache: 'npm' is intentionally removed — package-lock.json
          # is not committed, so caching would fail the build

      # ── 4. Install Capacitor ──────────────────────────────────────
      - name: Install dependencies
        run: npm install

      # ── 5. Add Android platform (generates ./android folder) ──────
      - name: Add Android platform
        run: npx cap add android

      # ── 6. Sync web assets into the Android project ───────────────
      - name: Sync web assets
        run: npx cap sync android

      # ── 7. Copy custom app icon if provided ───────────────────────
      - name: Copy app icon (if exists)
        run: |
          if [ -f android-res/ic_launcher.png ]; then
            echo "Copying custom icons..."
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p android/app/src/main/res/mipmap-$density
              cp android-res/ic_launcher.png \
                 android/app/src/main/res/mipmap-$density/ic_launcher.png
              cp android-res/ic_launcher.png \
                 android/app/src/main/res/mipmap-$density/ic_launcher_round.png
            done
          else
            echo "No custom icon found, using default."
          fi

      # ── 8. Build the debug APK ────────────────────────────────────
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

      # ── 9. Rename APK ─────────────────────────────────────────────
      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             output/AmmanTemple-v${{ github.run_number }}.apk

      # ── 10. Upload artifact ───────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmmanTemple-APK-build-${{ github.run_number }}
          path: output/AmmanTemple-v${{ github.run_number }}.apk
          retention-days: 90
          if-no-files-found: error
