name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets
        run: npx cap sync android

      - name: Copy app icon (if exists)
        run: |
          if [ -f android-res/ic_launcher.png ]; then
            for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              mkdir -p android/app/src/main/res/mipmap-$density
              cp android-res/ic_launcher.png android/app/src/main/res/mipmap-$density/ic_launcher.png
              cp android-res/ic_launcher.png android/app/src/main/res/mipmap-$density/ic_launcher_round.png
            done
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          unset ANDROID_SDK_ROOT
          ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             output/AmmanTemple-v${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmmanTemple-APK-build-${{ github.run_number }}
          path: output/AmmanTemple-v${{ github.run_number }}.apk
          retention-days: 90
          if-no-files-found: error
